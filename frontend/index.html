<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Sistem Penerimaan Santri Baru Pesantren Ciawi Bogor Fathan Mubina">
<link rel="manifest" href="./manifest.webmanifest?v=32.12.0">
<link rel="stylesheet" href="./styles.css?v=32.12.0">
<link rel="apple-touch-icon" sizes="256x256" href="./assets/logo-fathan-mubina.png?v=32.7.0">
<link rel="icon" type="image/svg+xml" sizes="32x32" href="./icons/favicon-32.svg?v=32.7.0">
<link rel="icon" type="image/svg+xml" sizes="48x48" href="./icons/favicon-48.svg?v=32.7.0">
<title>PSB Fathan Mubina</title>
<style>.pwa-install-overlay[hidden]{display:none}.pwa-install-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(34,20,55,.45);backdrop-filter:blur(5px)}.pwa-install-card{width:min(420px,100%);padding:24px;border-radius:22px;background:#fff;text-align:center;box-shadow:0 18px 55px rgba(30,16,50,.25)}.pwa-install-card>img{border-radius:18px}.pwa-install-card h2{margin:12px 0 8px}.pwa-install-card p{color:#756d7d;font-size:14px;line-height:1.5}.pwa-install-actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.pwa-install-actions button{min-width:120px}</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="bootProgress" class="boot-progress hidden"><span class="mini-spin"></span><span class="boot-copy" id="bootProgressText">Menyiapkan aplikasi...</span></div>
<div id="loading" class="loading" role="status" aria-live="polite"><div class="loading-box splash-box"><div class="splash-logo-wrap"><div class="splash-logo" id="splashLogo"><img class="app-logo-img splash-app-logo" src="./assets/logo-fathan-mubina.png?v=32.7.0" alt="PSB Fathan Mubina" width="96" height="96" loading="eager" fetchpriority="high" decoding="async" onerror="this.hidden=true;this.nextElementSibling.style.display='grid'"><span class="app-logo-fallback" aria-hidden="true"></span></div></div><b id="loadingText">Memuat aplikasi...</b><div class="muted splash-subtitle">Menyiapkan PSB Fathan Mubina</div><div class="splash-progress"><span></span></div></div></div>
<section id="installOverlay" class="pwa-install-overlay" hidden aria-hidden="true">
  <div class="pwa-install-card" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <img src="./assets/logo-fathan-mubina.png?v=32.7.0" alt="" width="76" height="76">
    <h2 id="installTitle">Install PSB Fathan Mubina</h2>
    <p id="installText">Pasang PSB FM di perangkat agar dapat dibuka seperti aplikasi.</p>
    <div id="installSteps" hidden></div>
    <div class="pwa-install-actions"><button type="button" id="installLater" class="btn btn-secondary">Nanti</button><button type="button" id="installBtn" class="btn btn-primary">Install</button></div>
  </div>
</section>
<script src="./api-bridge.js?v=32.11.0"></script>
<script src="./app.js?v=32.12.0"></script>
<script>
(function(){
  'use strict';
  if('serviceWorker' in navigator){
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(refreshing)return;
      refreshing=true;
      window.location.reload();
    });
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js?v=32.12.0',{updateViaCache:'none'})
        .then(function(reg){return reg.update().catch(function(e){console.warn('Service worker update:',e);});})
        .catch(function(e){console.warn('Service worker:',e);});
    });
  }
  let deferredInstallPrompt=null;
  const overlay=document.getElementById('installOverlay'),btn=document.getElementById('installBtn'),later=document.getElementById('installLater'),info=document.getElementById('installText'),steps=document.getElementById('installSteps');
  const installMode=new URLSearchParams(location.search).has('install');
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const ios=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function show(){if(standalone())return;overlay.hidden=false;overlay.setAttribute('aria-hidden','false');}
  function hide(){overlay.hidden=true;overlay.setAttribute('aria-hidden','true');}
  function setup(){if(!installMode||standalone())return;if(ios()){info.textContent='Di iPhone/iPad, pemasangan dilakukan melalui menu Bagikan di browser.';steps.hidden=false;steps.innerHTML='<p>Buka menu Bagikan, pilih Tambahkan ke Layar Utama, lalu pilih Tambah.</p>';btn.textContent='Lihat Cara';btn.disabled=false;show();return;}show();btn.disabled=!deferredInstallPrompt;if(!deferredInstallPrompt){btn.textContent='Menyiapkan…';info.textContent='Menyiapkan opsi pemasangan dari browser…';}}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstallPrompt=e;if(installMode&&!standalone()){btn.disabled=false;btn.textContent='Install';info.textContent='Pasang PSB FM di perangkat agar dapat dibuka seperti aplikasi.';show();}});
  btn.addEventListener('click',async function(){if(ios()){steps.hidden=false;steps.innerHTML='<p>Buka menu Bagikan di browser, pilih Tambahkan ke Layar Utama, lalu pilih Tambah.</p>';return;}if(!deferredInstallPrompt){info.textContent='Buka menu browser lalu pilih Install app atau Add to Home Screen.';steps.hidden=false;steps.innerHTML='<p>Cari menu Install app, Install, atau Add to Home Screen.</p>';return;}const prompt=deferredInstallPrompt;deferredInstallPrompt=null;btn.disabled=true;try{await prompt.prompt();}catch(e){console.warn('Install prompt:',e);}hide();});
  later.addEventListener('click',hide);window.addEventListener('appinstalled',hide);window.addEventListener('load',setup);
})();
</script>

<div id="bootFailure" hidden role="alert" aria-live="assertive" style="position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:24px;background:#f7f4fb;color:#241a31;font:16px/1.5 system-ui,sans-serif;text-align:center">
  <div style="max-width:440px;padding:28px;border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(35,20,55,.14)">
    <h1 style="margin:0 0 10px;font-size:22px">Aplikasi belum berhasil dimuat</h1>
    <p style="margin:0 0 20px">Muat ulang halaman. Jika masalah berulang, catat waktu kejadian dan hubungi pengelola aplikasi.</p>
    <button type="button" id="bootFailureReload" style="padding:11px 20px;border:0;border-radius:10px;background:#6d28d9;color:#fff;font:inherit;font-weight:700;cursor:pointer">Muat ulang</button>
  </div>
</div>
<style>#bootFailure[hidden]{display:none!important}#bootFailure:not([hidden]){display:flex!important}</style>
<script>
(function(){
  'use strict';
  var shown=false;
  function stillBooting(){
    var loading=document.getElementById('loading');
    var app=document.getElementById('app');
    return !!(loading&&!loading.classList.contains('hidden')) || !!(app&&!app.childElementCount);
  }
  function showStartupFailure(reason){
    if(shown||!stillBooting())return;
    shown=true;
    console.error('[PSB] Startup failed:',reason);
    var panel=document.getElementById('bootFailure');
    if(panel)panel.hidden=false;
    var loading=document.getElementById('loading');
    if(loading)loading.classList.add('hidden');
  }
  window.addEventListener('error',function(event){
    if(event.target===window)showStartupFailure(event.message||'script error');
  });
  window.addEventListener('unhandledrejection',function(event){showStartupFailure(event.reason||'unhandled rejection');});
  document.getElementById('bootFailureReload').addEventListener('click',function(){window.location.reload();});
  window.setTimeout(function(){showStartupFailure('startup timeout');},25000);
})();
</script>
</body>
</html>
