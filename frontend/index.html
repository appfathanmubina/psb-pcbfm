<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#800080">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Sistem Penerimaan Santri Baru Pesantren Ciawi Bogor Fathan Mubina">
<link rel="manifest" href="./manifest.webmanifest?v=32.17.0">
<link rel="stylesheet" href="./styles.css?v=32.27.0">
<link rel="apple-touch-icon" sizes="256x256" href="./assets/logo-fathan-mubina.png?v=32.7.0">
<link rel="icon" type="image/svg+xml" sizes="32x32" href="./icons/favicon-32.svg?v=32.7.0">
<link rel="icon" type="image/svg+xml" sizes="48x48" href="./icons/favicon-48.svg?v=32.7.0">
<title>PSB Fathan Mubina</title>
<style>
.pwa-install-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:950;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 17px;border:0;border-radius:999px;background:linear-gradient(120deg,#520052,#A64CA6);color:#fff;font:700 13px/1 system-ui,sans-serif;box-shadow:0 8px 24px rgba(82,0,82,.28);cursor:pointer}
.pwa-install-icon{display:block;flex:0 0 20px;width:20px;height:20px}.pwa-install-fab[hidden]{display:none}.pwa-install-fab:focus-visible,.pwa-install-actions button:focus-visible{outline:3px solid #E6CCE6;outline-offset:3px}
.pwa-install-overlay[hidden]{display:none}.pwa-install-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(34,20,55,.45);backdrop-filter:blur(5px)}
.pwa-install-card{width:min(420px,100%);max-height:min(88vh,680px);overflow:auto;padding:24px;border-radius:22px;background:#fff;text-align:center;box-shadow:0 18px 55px rgba(30,16,50,.25)}
.pwa-install-card>img{border-radius:18px;object-fit:contain}.pwa-install-card h2{margin:12px 0 8px}.pwa-install-card p{color:#756d7d;font-size:14px;line-height:1.55}
.pwa-install-steps{margin:14px 0 0;padding:13px 16px;border-radius:14px;background:#f7f4fc;text-align:left;color:#51465f;font-size:13px;line-height:1.65}
.pwa-install-steps ol{margin:7px 0 0;padding-left:20px}.pwa-install-steps li+li{margin-top:5px}.pwa-install-actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.pwa-install-actions button{min-width:120px}
@media(max-width:600px){.pwa-install-fab{right:14px;bottom:calc(84px + env(safe-area-inset-bottom));min-height:44px;padding:0 14px}.pwa-install-card{padding:22px 18px}}
@media (display-mode:standalone){.pwa-install-fab{display:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="bootProgress" class="boot-progress hidden"><span class="mini-spin"></span><span class="boot-copy" id="bootProgressText">Menyiapkan aplikasi...</span></div>
<div id="loading" class="loading hidden" role="status" aria-live="polite"><div class="loading-box splash-box"><div class="splash-logo-wrap"><div class="splash-logo" id="splashLogo"><img class="app-logo-img splash-app-logo" src="./assets/logo-fathan-mubina.png?v=32.7.0" alt="PSB Fathan Mubina" width="96" height="96" loading="eager" fetchpriority="high" decoding="async" onerror="this.hidden=true;this.nextElementSibling.style.display='grid'"><span class="app-logo-fallback" aria-hidden="true"></span></div></div><b id="loadingText">Memuat aplikasi...</b><div class="muted splash-subtitle">Menyiapkan PSB Fathan Mubina</div><div class="splash-progress"><span></span></div></div></div>
<button type="button" id="pwaInstallOpen" class="pwa-install-fab" hidden aria-haspopup="dialog" aria-controls="installOverlay"><svg class="pwa-install-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.2v7.1m-2.8-2.8L12 14.3l2.8-2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 18.2h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Pasang Aplikasi</span></button>
<section id="installOverlay" class="pwa-install-overlay" hidden aria-hidden="true">
  <div class="pwa-install-card" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <img src="./assets/logo-fathan-mubina.png?v=32.7.0" alt="" width="76" height="76">
    <h2 id="installTitle">Install PSB Fathan Mubina</h2>
    <p id="installText">Pasang PSB FM di perangkat agar dapat dibuka seperti aplikasi.</p>
    <div id="installSteps" hidden></div>
    <div class="pwa-install-actions"><button type="button" id="installLater" class="btn btn-secondary">Nanti</button><button type="button" id="installBtn" class="btn btn-primary">Install</button></div>
  </div>
</section>
<script src="./api-bridge.js?v=32.19.0"></script>
<script src="./app.js?v=32.41.0"></script>
<script>
(function(){
  'use strict';
  if('serviceWorker' in navigator){
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(refreshing)return;
      refreshing=true;
      window.location.reload();
    });
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js?v=32.44.0',{updateViaCache:'none'})
        .then(function(reg){return reg.update().catch(function(e){console.warn('Service worker update:',e);});})
        .catch(function(e){console.warn('Service worker:',e);});
    });
  }

  let deferredInstallPrompt=null;
  let installed=false;
  const overlay=document.getElementById('installOverlay');
  const openButton=document.getElementById('pwaInstallOpen');
  const installButton=document.getElementById('installBtn');
  const laterButton=document.getElementById('installLater');
  const info=document.getElementById('installText');
  const steps=document.getElementById('installSteps');
  const installMode=new URLSearchParams(location.search).has('install');
  const appRoot=document.getElementById('app');
  function syncInstallButtonVisibility(){
    const onPublicHome=!!appRoot.querySelector('.public-hero');
    const onLogin=!!appRoot.querySelector('.login-card #identifier');
    const allowedPage=onPublicHome||onLogin;
    openButton.hidden=installed||!allowedPage;
    if(!allowedPage&&!overlay.hidden)hide();
  }
  const installPageObserver=new MutationObserver(syncInstallButtonVisibility);
  installPageObserver.observe(appRoot,{childList:true,subtree:true});
  syncInstallButtonVisibility();
  const standalone=function(){
    return window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: minimal-ui)').matches ||
      navigator.standalone===true;
  };
  const isIOS=function(){
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  };
  const isAndroid=function(){return /Android/i.test(navigator.userAgent);};
  function hide(){
    overlay.hidden=true;
    overlay.setAttribute('aria-hidden','true');
  }
  function show(){
    if(installed||standalone())return;
    overlay.hidden=false;
    overlay.setAttribute('aria-hidden','false');
  }
  function setSteps(items){
    steps.hidden=false;
    const list=document.createElement('ol');
    items.forEach(function(item){
      const li=document.createElement('li');
      li.textContent=item;
      list.appendChild(li);
    });
    steps.replaceChildren(list);
  }
  function renderGuide(){
    if(isIOS()){
      info.textContent='Untuk memasang di iPhone atau iPad, buka halaman ini menggunakan Safari.';
      setSteps([
        'Di Safari, tekan tombol Bagikan (ikon kotak dengan panah ke atas).',
        'Gulir menu lalu pilih Tambahkan ke Layar Utama.',
        'Pastikan nama PSB Fathan Mubina, lalu tekan Tambah.'
      ]);
      installButton.textContent='Saya Mengerti';
      installButton.disabled=false;
      return;
    }
    if(deferredInstallPrompt){
      info.textContent='Browser siap memasang PSB Fathan Mubina sebagai aplikasi.';
      steps.hidden=true;
      installButton.textContent='Install Sekarang';
      installButton.disabled=false;
      return;
    }
    if(isAndroid()){
      info.textContent='Jika tombol Install belum tersedia, pemasangan tetap bisa dilakukan dari menu Chrome.';
      setSteps([
        'Pastikan halaman dibuka melalui Google Chrome dan alamatnya menggunakan HTTPS.',
        'Tekan menu tiga titik di kanan atas.',
        'Pilih Install app atau Tambahkan ke layar utama.',
        'Ikuti konfirmasi pemasangan dari Android.'
      ]);
    }else{
      info.textContent='Pemasangan bergantung pada dukungan browser. Gunakan browser terbaru yang mendukung PWA.';
      setSteps([
        'Buka menu browser (biasanya ikon tiga titik atau menu di bilah alamat).',
        'Cari Install app, Install this site as an app, atau Add to Home Screen.',
        'Pilih perintah tersebut dan ikuti konfirmasi browser.'
      ]);
    }
    installButton.textContent='Lihat Petunjuk';
    installButton.disabled=false;
  }
  async function syncInstallState(){
    installed=standalone();
    syncInstallButtonVisibility();
    if(installed){hide();return;}
    if(typeof navigator.getInstalledRelatedApps==='function'){
      try{
        const relatedApps=await navigator.getInstalledRelatedApps();
        if(relatedApps.some(function(app){return app.platform==='webapp';})){
          installed=true;
          syncInstallButtonVisibility();
          hide();
        }
      }catch(error){
        console.warn('Installed PWA detection:',error);
      }
    }
  }
  openButton.addEventListener('click',function(){
    renderGuide();
    show();
  });
  installButton.addEventListener('click',async function(){
    if(isIOS()){
      hide();
      return;
    }
    if(!deferredInstallPrompt){
      renderGuide();
      return;
    }
    const prompt=deferredInstallPrompt;
    deferredInstallPrompt=null;
    installButton.disabled=true;
    try{
      await prompt.prompt();
      const choice=await prompt.userChoice;
      if(choice&&choice.outcome==='accepted'){
        info.textContent='Permintaan pemasangan diterima. Ikuti proses yang ditampilkan browser.';
        hide();
      }else{
        renderGuide();
      }
    }catch(error){
      console.warn('Install prompt:',error);
      renderGuide();
    }
  });
  laterButton.addEventListener('click',hide);
  window.addEventListener('beforeinstallprompt',function(event){
    event.preventDefault();
    deferredInstallPrompt=event;
    if(!installed){
      syncInstallButtonVisibility();
      if(!overlay.hidden)renderGuide();
    }
  });
  window.addEventListener('appinstalled',function(){
    installed=true;
    deferredInstallPrompt=null;
    syncInstallButtonVisibility();
    hide();
  });
  window.addEventListener('load',async function(){
    await syncInstallState();
    if(installMode&&!installed){
      renderGuide();
      show();
    }
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden)syncInstallState();
  });
})();
</script>
</body>
</html>
