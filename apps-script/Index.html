  <style>
:root{
  --primary:#7c3aed;--primary-dark:#5b21b6;--primary-soft:#f2edff;
  --bg:#eee7ff;--surface:#fff;--text:#211c28;--muted:#756d7d;
  --line:#e8e3ee;--success:#15803d;--danger:#dc2626;
  --shadow:0 2px 12px rgba(45,31,75,.06);--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-width:0;min-height:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden;overflow-y:auto;font-size:16px;min-height:100svh}
button,input{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.6}.hidden{display:none!important}
.app{width:100%;min-width:0;min-height:100svh;isolation:isolate}.app > *{min-width:0}

.topbar{
  position:fixed;left:0;right:0;top:0;z-index:40;height:64px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  background:rgba(255,255,255,.98);border-bottom:1px solid var(--line)
}
.brand{height:48px;width:100%;display:flex;align-items:center;gap:11px}
.logo{
  width:44px;height:44px;flex:0 0 44px;border-radius:14px;
  background:linear-gradient(145deg,var(--primary),#8b5cf6);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:900;
  box-shadow:0 5px 14px rgba(124,58,237,.16)
}
.app-logo-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}.logo .app-logo-img{width:100%;height:100%;padding:0;object-fit:cover}.app-logo-img + .app-logo-fallback{display:none}.app-logo-fallback{display:grid;place-items:center;width:100%;height:100%;font-weight:900;color:#fff}
.brand-copy{min-width:0;flex:1}
.brand h1{margin:0;font-size:16px;line-height:1.2;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:3px 0 0;font-size:12px;line-height:1.2;color:var(--muted)}
.user-chip{
  width:max-content;max-width:min(360px,42vw);min-width:0;padding:8px 10px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:11px;font-weight:800;height:40px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;justify-content:flex-end;gap:7px;font:inherit;color:var(--text);cursor:pointer;margin-right:0
}
.user-name{min-width:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;order:1;text-align:right}
.user-icon{flex:0 0 auto;display:grid;place-items:center;order:2}
.user-icon .ico-visual{margin:0;width:22px;height:22px;border-radius:7px}
.shell{width:100%;max-width:none;margin:0;padding:calc(76px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));min-height:100svh}
.hero{
  margin:0 0 12px;padding:18px 17px;border-radius:20px;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;box-shadow:0 8px 22px rgba(109,40,217,.15)
}
.hero h2{margin:0;font-size:20px;line-height:1.25;font-weight:850}
.hero p{margin:6px 0 0;font-size:12px;line-height:1.5;opacity:.94}
.status-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin:0 0 12px}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.status-row b{font-size:15px}.status-row .muted{font-size:12px!important}
.pill{font-size:11px;font-weight:850;padding:6px 9px;border-radius:999px;background:#ede9fe;color:var(--primary-dark);white-space:nowrap}
.pill.ok{background:#dcfce7;color:#15803d}
.section-title{margin:16px 2px 9px;font-size:14px;font-weight:850;color:#4a4251}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  min-width:0;min-height:150px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-start;transition:transform .12s ease
}

/* =============================
   STAGE 18 — PROFESSIONAL UI REFINEMENT
   Visual-only refinement: preserves Stage 17 workflow/functionality.
   ============================= */
:root{
  --primary:#6d28d9;
  --primary-dark:#4c1d95;
  --primary-soft:#f4efff;
  --primary-wash:#faf8ff;
  --bg:#f7f7fa;
  --surface:#ffffff;
  --text:#211d27;
  --muted:#746d7a;
  --line:#e7e3eb;
  --line-strong:#d9d3e0;
  --success:#15803d;
  --warning:#b45309;
  --danger:#dc2626;
  --info:#2563eb;
  --shadow:0 1px 2px rgba(34,25,46,.03),0 8px 24px rgba(34,25,46,.055);
  --shadow-hover:0 4px 18px rgba(34,25,46,.09);
  --radius:16px;
}
html,body{background:var(--bg);color:var(--text)}
body{font-size:15px}
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(109,40,217,.16);outline-offset:1px}

.topbar{height:66px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 1px 10px rgba(34,25,46,.025);backdrop-filter:blur(14px)}
.brand{height:50px;gap:10px}
.logo{width:42px;height:42px;flex-basis:42px;border-radius:12px;box-shadow:0 5px 14px rgba(109,40,217,.14)}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand p{font-size:11px}
.header-action,.user-chip,.sidebar-toggle{border-color:var(--line);box-shadow:0 1px 4px rgba(34,25,46,.035)}
.header-action:hover,.user-chip:hover,.sidebar-toggle:hover{background:var(--primary-soft);border-color:#d9caff;color:var(--primary-dark)}

.shell{background:var(--bg);padding-top:calc(82px + env(safe-area-inset-top));}
.hero{margin-bottom:16px;padding:20px 20px;border-radius:18px;background:linear-gradient(135deg,#5b21b6,#7c3aed);box-shadow:0 10px 26px rgba(91,33,182,.13)}
.hero h2{font-size:19px;letter-spacing:-.01em}.hero p{font-size:11px;opacity:.9}
.section-title{margin:20px 2px 9px;font-size:13px;color:#4d4653;letter-spacing:.01em}

.card,.status-card,.progress-card,.dashboard-kpi,.dashboard-section,.selection-card,.announcement-card,.notification-card,.registration-item,.doc-item,.master-item,.doc-stat,.public-card,.public-info{border-radius:16px;border-color:var(--line);box-shadow:var(--shadow)}
.card:hover,.registration-item:hover,.doc-item:hover,.master-item:hover,.selection-card:hover{box-shadow:var(--shadow-hover)}
.card{min-height:142px;padding:16px}
.icon{width:44px;height:44px;border-radius:13px;margin-bottom:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 12px rgba(45,31,75,.07)}
.ico-visual{box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 4px 8px rgba(0,0,0,.11)}
.card b{font-size:13px;font-weight:800}.card p{font-size:11px}

.btn{min-height:46px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.005em}
.btn-primary{background:var(--primary);box-shadow:0 5px 14px rgba(109,40,217,.14)}
.btn-primary:hover{background:#5b21b6;box-shadow:0 7px 18px rgba(109,40,217,.19);transform:translateY(-1px)}
.btn-secondary{background:#fff;color:var(--primary-dark);border:1px solid #dcd3e7;box-shadow:none}
.btn-secondary:hover{background:var(--primary-soft);border-color:#cfc0ea}
.btn-danger{background:#fff5f5;color:#b91c1c;border:1px solid #fecaca}
.btn-danger:hover{background:#feecec;border-color:#fca5a5}
.link-btn{color:var(--primary-dark)}

.pill,.announcement-status,.doc-required,.doc-status,.selection-status,.wali-flow-badge{border-radius:999px;font-weight:800;letter-spacing:.01em}
.pill{padding:5px 9px;background:#f1ecfb;color:var(--primary-dark);border:1px solid #e4daf5}
.pill.ok{background:#ecfdf3;color:#166534;border-color:#bbf7d0}

.field{margin:16px 0}.field label{font-size:12px;font-weight:800;color:#443c4a;margin-bottom:7px}
.field input,.field textarea,.textarea-field,.select-field,.doc-select{border-color:var(--line-strong);border-radius:12px;background:#fff;box-shadow:inset 0 1px 1px rgba(34,25,46,.02)}
.field input,.select-field{height:50px;font-size:14px}
.field input:focus,.field textarea:focus,.textarea-field:focus,.select-field:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(109,40,217,.10)}
.field input::placeholder,.field textarea::placeholder{color:#a49ca9}
.form-section{border-radius:16px;border-color:var(--line);box-shadow:var(--shadow);padding:17px}
.form-section-head{margin-bottom:14px}.form-step{width:30px;height:30px;border-radius:10px}
.form-section h3{font-size:14px;font-weight:850}.form-section p{font-size:10px}
.form-actions{background:rgba(247,247,250,.94);border-top:1px solid rgba(231,227,235,.7);backdrop-filter:blur(14px);padding:10px 0}

.search-box,.filter-box{border-color:var(--line);border-radius:12px;box-shadow:var(--shadow)}
.search-input{font-size:13px}.filter-box{background:#fff}
.selection-tab{border-radius:10px;border-color:var(--line);padding:9px 13px}.selection-tab.active{background:var(--primary-soft);border-color:#d6c6f5;color:var(--primary-dark)}
.master-tab{border-color:var(--line)}.master-tab.active{border-color:#d6c6f5}

.dashboard-kpi{padding:15px}.dashboard-kpi .kpi-label{font-size:10px}.dashboard-kpi .kpi-value{font-size:24px}.dashboard-section{padding:16px}
.report-summary{border-radius:13px;background:#fbfaff;border-color:#ebe5f2}
.report-table-wrap{border-color:var(--line);border-radius:13px;box-shadow:var(--shadow)}
.report-table th{background:#faf9fc;color:#5d5664}.report-table td{font-size:10px}
.empty-state,.selection-empty,.announcement-empty,.doc-empty,.wali-flow-empty{border-color:#ddd6e5;background:#fff;border-radius:14px}

.sidebar-nav{padding:16px 11px;gap:4px}.side-btn{padding:9px 10px;border-radius:12px;font-size:11px;color:#665e6d}.side-btn:hover{background:#f7f3fb}.side-btn.active{background:var(--primary-soft);color:var(--primary-dark);box-shadow:inset 3px 0 0 var(--primary)}
.side-icon{width:32px;height:32px;flex-basis:32px}.side-icon .ico-visual{width:30px;height:30px;border-radius:9px}
.sidebar-footer{padding:12px 10px 15px}.side-user{padding:8px;border-radius:12px}.side-user:hover{background:#faf8fc}
.desktop-device .sidebar{top:66px;width:248px;background:rgba(255,255,255,.98);box-shadow:7px 0 22px rgba(34,25,46,.035)}
.desktop-device .shell{width:calc(100% - 248px);margin-left:248px;padding:86px 30px 42px}
.desktop-device .topbar{height:66px;padding:8px 14px}
.desktop-device .grid{gap:14px}.desktop-device .card{min-height:148px;padding:16px}

.modal{border-radius:20px 20px 0 0}.alert-modal .modal{border-radius:20px;box-shadow:0 20px 70px rgba(25,18,38,.20)}
.public-wrap{background:linear-gradient(180deg,#f2edff 0,#f7f7fa 48%,#f7f7fa 100%)}
.public-hero{border-radius:20px;box-shadow:0 10px 26px rgba(91,33,182,.12)}
.login-wrap{background:linear-gradient(180deg,#f2edff 0,#f7f7fa 43%,#f7f7fa 100%)}
.login-card form{border-color:var(--line);box-shadow:var(--shadow);border-radius:18px}
.loading{background:linear-gradient(180deg,#f2edff 0,#f7f7fa 60%,#fff 100%)}

@media(max-width:699px){
  .shell{padding-left:13px;padding-right:13px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .hero{padding:18px;border-radius:17px}
  .grid{gap:10px}.card{min-height:136px;padding:15px}
  .bottom-nav{min-height:70px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(34,25,46,.045)}
  .nav-inner{gap:4px}.nav-btn{min-height:56px;border-radius:13px;font-size:10px}.nav-icon .ico-visual{width:31px;height:31px;border-radius:10px}
  .chat-fab{display:flex}
  .registration-actions,.doc-actions{gap:7px}.registration-actions .btn,.doc-actions .btn{min-height:42px;font-size:11px}
  .form-section{padding:15px}.form-actions-inner{gap:7px}.form-actions .btn{min-height:48px;font-size:12px}
}
@media(min-width:700px){
  .form-section{padding:19px}.field{margin:15px 0}
  .dashboard-kpi{min-height:118px}.dashboard-section{margin-top:16px}
}


/* =============================
   STAGE 29.1 — VISUAL REFINEMENT
   Visual-only: hierarchy, breathing room, surface depth.
   No workflow/business logic changes.
   ============================= */
:root{
  --surface-soft:#fbfaff;
  --line-soft:#eeeaf3;
  --shadow-soft:0 1px 2px rgba(34,25,46,.025),0 5px 16px rgba(34,25,46,.035);
}
body{background:linear-gradient(180deg,#f8f7fa 0%,#f6f5f8 100%)}
.shell{padding-top:calc(80px + env(safe-area-inset-top))}
.hero{position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(109,40,217,.13);border:1px solid rgba(255,255,255,.22)}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-65px;top:-95px;background:rgba(255,255,255,.10);pointer-events:none}
.section-title{margin:24px 2px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#716779}
/* Let content sections breathe instead of making every block look equally heavy. */
.status-card,.progress-card,.dashboard-section,.form-section{box-shadow:var(--shadow-soft);border-color:var(--line-soft)}
.status-card{padding:16px 17px;background:linear-gradient(180deg,#fff 0%,#fdfcff 100%)}
.progress-card{background:linear-gradient(180deg,#fff 0%,#fcfbfd 100%)}
.dashboard-kpi-grid{gap:12px}
.dashboard-kpi{border:0;border-left:3px solid #c4b5fd;border-radius:14px;background:#fff;box-shadow:var(--shadow-soft);padding:14px 15px}
.dashboard-kpi:nth-child(2){border-left-color:#a78bfa}.dashboard-kpi:nth-child(3){border-left-color:#8b5cf6}.dashboard-kpi:nth-child(4){border-left-color:#7c3aed}
.dashboard-kpi .kpi-value{letter-spacing:-.02em}
.dashboard-section{background:transparent;border:0;border-radius:0;padding:2px 0;margin-top:24px;box-shadow:none}
.dashboard-section-head{padding:0 2px 10px;margin-bottom:0;border-bottom:1px solid var(--line)}
.dashboard-section-head b{font-size:15px;letter-spacing:-.01em}
.dashboard-section-head span{color:#82798b}
.dashboard-ops-grid{gap:10px!important}
.dashboard-ops-grid > *{box-shadow:var(--shadow-soft)!important;border-color:var(--line-soft)!important}
/* Cards become quieter; only important interaction surfaces keep elevation. */
.card{border-color:var(--line-soft);box-shadow:0 1px 2px rgba(34,25,46,.02);background:#fff;min-height:138px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.card:active{transform:translateY(0) scale(.99)}
.icon{box-shadow:none;border:1px solid #eee8f6;background:#faf8fd}
.form-section{background:#fff;border:1px solid var(--line-soft);box-shadow:0 1px 2px rgba(34,25,46,.02),0 4px 14px rgba(34,25,46,.025);padding:18px}
.form-section + .form-section{margin-top:14px}
.form-section-head{padding-bottom:11px;border-bottom:1px solid #f1edf4}
.form-section h3{letter-spacing:-.01em}
.field label{color:#5e5667;font-weight:800}
input,select,textarea{border-color:#e4dfea!important;background:#fdfcff!important;box-shadow:inset 0 1px 1px rgba(45,31,75,.025)!important}
input:focus,select:focus,textarea:focus{background:#fff!important;box-shadow:0 0 0 3px rgba(109,40,217,.09)!important}
.btn{box-shadow:none}
.btn-primary{box-shadow:0 5px 13px rgba(109,40,217,.14)}
/* Lists/tables read as content, not stacks of boxes. */
.registration-item,.doc-item,.master-item,.notification-card,.announcement-card,.selection-card{box-shadow:none;border-color:var(--line-soft);background:#fff}
.registration-item + .registration-item,.doc-item + .doc-item,.master-item + .master-item,.notification-card + .notification-card{border-top-left-radius:0;border-top-right-radius:0;margin-top:-1px}
.report-table-wrap{box-shadow:none;border-color:var(--line-soft);background:#fff}
.report-summary{background:#fbfaff;border-color:#eee8f5;box-shadow:none}
.empty-state{background:linear-gradient(180deg,#fff,#fcfbfd);border:1px dashed #ded7e7!important;box-shadow:none}
.modal-backdrop{backdrop-filter:blur(5px)}
.modal{box-shadow:0 24px 70px rgba(25,18,38,.18)}
/* Desktop: wider rhythm and less visual repetition. */
@media(min-width:760px){
  .desktop-device .shell{padding-left:30px;padding-right:38px}
  .desktop-device .hero{padding:24px 23px;border-radius:22px}
  .desktop-device .grid{gap:14px}
  .desktop-device .card{min-height:142px}
  .desktop-device .dashboard-kpi-grid{gap:14px}
  .desktop-device .form-section{padding:20px}
}
@media(max-width:699px){
  .shell{padding-left:13px;padding-right:13px}
  .hero{border-radius:18px}
  .dashboard-section{margin-top:22px}
  .dashboard-kpi{padding:13px 14px}

(function lockDeviceLayout(){
  const ua = navigator.userAgent || navigator.vendor || '';
  const mobileUA = /Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini|webOS/i.test(ua);
  const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const sw = Number(window.screen && window.screen.width || 0);
  const sh = Number(window.screen && window.screen.height || 0);
  const shortSide = Math.min(sw || 9999, sh || 9999);
  const mobile = mobileUA || ((coarse || touch) && shortSide <= 1024);
  const root = document.documentElement;
  const app = document.getElementById('app');
  root.classList.toggle('mobile-device', mobile);
  root.classList.toggle('desktop-device', !mobile);
  // Keep the device class on <body> too because the shell CSS scopes
  // desktop/mobile layout rules from body descendants.
  document.body.classList.toggle('mobile-device', mobile);
  document.body.classList.toggle('desktop-device', !mobile);

  // Do not use CSS zoom/transform to force a mobile layout. In Apps Script
  // HTML Service the app runs inside a sandboxed iframe; the iframe itself is
  // the app viewport. Keep the canvas at 1:1 so text, icons and touch targets
  // remain physically usable and accessible.
  if(app){
    root.style.setProperty('--app-viewport-width', (window.visualViewport?.width || window.innerWidth || root.clientWidth || 0) + 'px');
    root.style.setProperty('--app-viewport-height', (window.visualViewport?.height || window.innerHeight || root.clientHeight || 0) + 'px');
  }
})();

function normalizeAssetUrl(raw){
  let url=String(raw||'').trim();
  if(!url)return '';

  // Drive's thumbnail endpoint is more reliable inside Apps Script HTML Service
  // than rendering a /file/d/... page as an <img>.
  let m=url.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/i);
  if(!m)m=url.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*?&)?id=([A-Za-z0-9_-]{10,})/i);
  if(!m)m=url.match(/docs\.google\.com\/(?:uc|file)\?(?:[^#]*?&)?id=([A-Za-z0-9_-]{10,})/i);
  if(!m)m=url.match(/[?&]id=([A-Za-z0-9_-]{10,})/i);

function bootProgress(show,text='Menyiapkan aplikasi...',done=false){const el=$('bootProgress'),tx=$('bootProgressText');if(!el)return;if(!show){el.classList.add('hidden');el.classList.remove('done');return}if(tx)tx.textContent=text;el.classList.remove('hidden','done');if(done){el.classList.add('done');setTimeout(()=>el.classList.add('hidden'),650)}}
async function initializeAfterLogin(){
  if(state.appInitialized || state.preloadRunning)return;
  state.appInitialized=true;
  state.preloadRunning=true;
  bootProgress(true,'Memuat data Pendaftaran (1/3)...');
  try{
    let reg=null;
    try{reg=await server('getMyRegistrations',state.token);}catch(e){reg=null;}
    if(reg?.success){state.registrationList=reg.registrations||[];state.cache.registration=state.registrationList;}
    const firstId=String(state.registrationList?.[0]?.registrationId||'');
    if(firstId){
      bootProgress(true,'Memuat data Dokumen & Pembayaran (2/3)...');
      const [doc,pay]=await Promise.allSettled([
        server('getDocumentPageData',state.token,firstId),
        server('getPaymentPageData',state.token,firstId)
      ]);
      if(doc.status==='fulfilled' && doc.value?.success){
        state.documentRegistrationId=String(doc.value.documentData?.registration?.registrationId||firstId);
        state.documentData=doc.value.documentData||null;
        state.cache.documents[state.documentRegistrationId]=doc.value;
      }
      if(pay.status==='fulfilled' && pay.value?.success){
        state.paymentRegistrationId=String(pay.value.paymentData?.registrationId||firstId);
        state.paymentData=pay.value.paymentData||null;
        state.paymentTypes=pay.value.paymentTypes||[];
        state.cache.payments[state.paymentRegistrationId]=pay.value;
      }
    }
    bootProgress(true,'Menyiapkan tampilan menu (3/3)...');
    state.preloadReady=true;
    bootProgress(true,'Data awal siap digunakan.',true);
  }catch(e){
    state.preloadReady=false;
    bootProgress(true,'Beranda siap. Data menu akan dilanjutkan saat dibuka.',true);
  }finally{state.preloadRunning=false;}
}
async function boot(){
  loading(true,'Memeriksa aplikasi...');
  try{
    // Jalankan pemeriksaan konfigurasi dan sesi secara paralel agar splash tidak
    // menunggu dua request server secara berurutan.
    if(state.token){
      const [pub,r]=await Promise.all([
        server('getPublicConfig',true),
        server('validateSession',state.token)
      ]);
      state.config=pub?.config||{}; applyAppIcon();
      hydrateSplashLogo();
      if(r?.success){
        state.user=r.user;
        renderApp();
        loading(false);
        initializeAfterLogin();
      }else{
        state.token='';
        localStorage.removeItem('psb_session');
        renderPublicHome('Sesi sebelumnya sudah berakhir. Silakan masuk kembali.');
      }
    }else{
      const pub=await server('getPublicConfig',true);
      state.config=pub?.config||{}; applyAppIcon();
      hydrateSplashLogo();
      renderPublicHome();
    }
  }catch(e){
    renderLogin('Aplikasi belum siap. Jalankan setupPSBDatabase() terlebih dahulu.');
  }
  loading(false);
}

function renderPublicGallery(items){
  resetPublicGallery();

    dots.innerHTML='';count.textContent='';return;

function updatePublicGallery(){

function goPublicGallery(index){

  };

async function reloadCurrentData(){
  if(!state.token || state.reloadingData)return;
  state.reloadingData=true;
  const btn=$('reloadDataBtn');
  if(btn){btn.disabled=true;btn.classList.add('is-reloading');btn.title='Memuat ulang data...';}
  try{
    invalidatePageSnapshots();
    invalidatePageDataCache();
    state.initialData=null;
    state.preloadReady=false;
    const [pub,session]=await Promise.all([
      server('getPublicConfig',true),
      server('validateSession',state.token)
    ]);
    if(!session?.success){
      localStorage.removeItem('psb_session');
      state.token='';
      state.user=null;
      renderPublicHome('Sesi sudah berakhir. Silakan masuk kembali.');
      showToast('Sesi sudah berakhir.','warning');
      return;
    }
    state.config=pub?.config||state.config||{};
    state.user=session.user||state.user;
    applyAppIcon();
    const current=state.page||'home';
    renderApp();
    state.page=current;
    goPage(current);
    showToast('Data berhasil dimuat ulang.','success');
  }catch(e){
    showToast('Gagal memuat ulang data. Silakan coba lagi.','error');
  }finally{
    state.reloadingData=false;
    if(btn){btn.disabled=false;btn.classList.remove('is-reloading');btn.title='Reload data';}
  }
}

function goPage(page){
  // Menekan menu Chat PSB ketika Chat sudah aktif harus benar-benar no-op.
  // Jangan menyimpan/memulihkan snapshot karena itu dapat mengganti DOM chat
  // yang sedang aktif dan terasa seperti reload.
  if(state.page===page){
    if(page==='chat')return;
    savePageSnapshot(page);
    if(restorePageSnapshot(page)){window.scrollTo({top:0,behavior:'auto'});return;}
  }
  if(state.page==='chat' && page!=='chat') stopChatPolling();
  else if(state.page)savePageSnapshot(state.page);
  state.page=page;
  document.querySelectorAll('.nav-btn,.side-btn').forEach(x=>x.classList.remove('active'));
  $('nav-'+page)?.classList.add('active');$('side-'+page)?.classList.add('active');
  if(restorePageSnapshot(page)){window.scrollTo({top:0,behavior:'auto'});return;}
  if(page==='home')renderHome();else if(page==='profile')renderProfile();else if(page==='master')renderMasterData();else if(page==='registration')renderRegistrationHub();else if(page==='applicants')renderApplicants();else if(page==='documents')renderDocuments();else if(page==='notifications')renderNotifications();else if(page==='announcement')renderAnnouncements();else if(page==='verification')renderVerification();else if(page==='payments')renderPayments();else if(page==='selection')renderSelection();else if(page==='reregistration')renderReregistration();else if(page==='reports')renderReports();else if(page==='chat')renderChat();else if(page==='audit')renderAudit();else if(page==='userManagement')renderUserManagementPage();else renderMore();
  window.scrollTo({top:0,behavior:'auto'});
}
function dashboardLocalKey(){return 'psb_dashboard_'+String(state.user?.userId||'guest')+'_'+String(state.config?.ACTIVE_YEAR||'2027/2028');}
