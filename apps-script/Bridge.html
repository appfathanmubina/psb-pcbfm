<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PSB Fathan Mubina API Bridge</title>
  <style>html,body{margin:0;width:100%;height:100%;background:transparent}#status{position:fixed;left:-9999px}</style>
</head>
<body>
  <div id="status">PSB API Bridge</div>
  <script>
  (function () {
    'use strict';
    const SOURCE = 'psb-fm-api-bridge';
    const VERSION = '32.19.0';
    const TARGET_ORIGIN = '<?= bridgeOrigin ?>';
    const CHALLENGE = '<?= bridgeChallenge ?>';
    const TOKEN = '<?= bridgeToken ?>';
    const BRIDGE_ERROR = '<?= bridgeError ?>';

    // This is an outbound-only handshake. The PWA does not postMessage into
    // this HTML Service frame because Apps Script Warden may drop that traffic.
    if (!TARGET_ORIGIN || !/^[a-f0-9]{32}$/i.test(CHALLENGE)) return;

    try {
      if (/^[a-f0-9]{64}$/i.test(TOKEN)) {
        window.top.postMessage({
          source: SOURCE,
          type: 'ready',
          version: VERSION,
          challenge: CHALLENGE,
          token: TOKEN
        }, TARGET_ORIGIN);
      } else {
        window.top.postMessage({
          source: SOURCE,
          type: 'error',
          version: VERSION,
          challenge: CHALLENGE,
          code: 'BRIDGE_TOKEN_ISSUE_FAILED',
          message: 'Apps Script tidak dapat menerbitkan token koneksi (' +
            String(BRIDGE_ERROR || 'TOKEN_ISSUE_FAILED') + ').'
        }, TARGET_ORIGIN);
      }
    } catch (error) {
      // The parent transport reports a bounded timeout if postMessage is blocked.
    }
  })();
  </script>
</body>
</html>
