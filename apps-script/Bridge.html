<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PSB Fathan Mubina API Bridge</title>
  <style>html,body{margin:0;width:100%;height:100%;background:transparent}#status{position:fixed;left:-9999px}</style>
</head>
<body>
  <div id="status">PSB API Bridge</div>
  <script>
  (function () {
    'use strict';
    const SOURCE = 'psb-fm-api-bridge';
    const VERSION = '32.6.0';
    const TARGET_ORIGIN = '<?= bridgeOrigin ?>';
    const CHALLENGE = '<?= bridgeChallenge ?>';
    const TOKEN = '<?= bridgeToken ?>';

    // This is an outbound-only handshake. The PWA does not postMessage into
    // this HTML Service frame because Apps Script Warden may drop that traffic.
    if (!TARGET_ORIGIN || !/^[a-f0-9]{32}$/i.test(CHALLENGE) ||
        !/^[a-f0-9]{64}$/i.test(TOKEN)) return;

    try {
      window.top.postMessage({
        source: SOURCE,
        type: 'ready',
        version: VERSION,
        challenge: CHALLENGE,
        token: TOKEN
      }, TARGET_ORIGIN);
    } catch (error) {
      // The parent transport will report a bounded timeout if the message
      // cannot be delivered. Do not expose internal frame details.
    }
  })();
  </script>
</body>
</html>
