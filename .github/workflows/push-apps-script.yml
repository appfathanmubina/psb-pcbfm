name: Validate Apps Script Source (Manual Sync)

on:
  workflow_dispatch:
    inputs:
      confirm_check:
        description: Type CHECK to validate repository source only
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_check == 'CHECK' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate repository source
        run: |
          node --check frontend/app.js
          node -e "const fs=require('fs'); const {isDeepStrictEqual}=require('util'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(!isDeepStrictEqual(a,b)){ console.error('Manifest mismatch; validation blocked.'); process.exit(1); }"
          node -e "const fs=require('fs'); const p='apps-script'; for (const f of ['Code.gs','Index.html','SetupDatabase.gs','Bridge.html','BridgeServer.gs','appsscript.json']) if(!fs.existsSync(p+'/'+f)) { console.error('Missing required file: '+p+'/'+f); process.exit(1); }"
      - name: Explain manual Apps Script synchronization
        run: |
          echo "Repository source validation completed."
          echo "No source was uploaded to Google Apps Script."
          echo "Automatic PUSH is disabled because no OAuth credentials are configured."
          echo "To synchronize, use the Google Apps Script editor or a separately authenticated deployment process."
