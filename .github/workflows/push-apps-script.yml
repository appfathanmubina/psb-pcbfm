name: Push Apps Script

on:
  workflow_dispatch:
    inputs:
      confirm_push:
        description: Type PUSH to authorize clasp push
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    if: ${{ inputs.confirm_push == 'PUSH' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Configure Apps Script project
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$SCRIPT_ID"
          printf '{"scriptId":"%s","rootDir":"apps-script"}\n' "$SCRIPT_ID" > apps-script/.clasp.json
      - name: Validate source
        run: |
          test -f apps-script/Code.gs
          test -f apps-script/Index.html
          test -f apps-script/SetupDatabase.gs
          test -f apps-script/Bridge.gs
          node --check frontend/app.js
      - name: Reconcile remote manifest before push
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          mkdir -p /tmp/psb-clasp
          printf '{"scriptId":"%s","rootDir":"/tmp/psb-clasp"}\n' "$SCRIPT_ID" > /tmp/psb-clasp/.clasp.json
          cd /tmp/psb-clasp
          clasp pull --force
          cmp -s "$GITHUB_WORKSPACE/appsscript.json" appsscript.json || { echo "Manifest DIFF: push blocked."; diff -u "$GITHUB_WORKSPACE/appsscript.json" appsscript.json || true; exit 1; }
      - name: Dry-run source status
        working-directory: apps-script
        run: |
          echo "=== clasp status: files that will be written ==="
          clasp show-file-status --json
      - name: Push source only
        working-directory: apps-script
        run: clasp push --force
