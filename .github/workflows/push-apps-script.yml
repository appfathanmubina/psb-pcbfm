name: Push Apps Script Source

on:
  workflow_dispatch:
    inputs:
      confirm_push:
        description: Type PUSH to upload the checked-in apps-script source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: psb-apps-script-production
  cancel-in-progress: false

jobs:
  push:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_push == 'PUSH' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate source and manifest
        run: |
          node --check frontend/app.js
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error('Root and Apps Script manifests differ');"
          for f in Code.gs Index.html SetupDatabase.gs Bridge.html BridgeServer.gs appsscript.json; do test -f "apps-script/$f"; done
      - name: Push source to Google Apps Script
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: node .github/scripts/apps-script-api.mjs push
