name: Apps Script Reconcile (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Pull remote project into disposable directory
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$SCRIPT_ID"
          if [[ ! "$SCRIPT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "APPS_SCRIPT_ID has an unexpected format." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/psb-clasp"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/psb-clasp/.clasp.json"
          (cd "$RUNNER_TEMP/psb-clasp" && clasp pull --force)
          test -f "$RUNNER_TEMP/psb-clasp/appsscript.json"
      - name: Compare repository and remote manifests
        run: |
          echo "=== Repository manifest ==="
          cat appsscript.json
          echo "=== Remote Apps Script manifest ==="
          cat "$RUNNER_TEMP/psb-clasp/appsscript.json"
          cmp -s appsscript.json "$RUNNER_TEMP/psb-clasp/appsscript.json" || {
            echo "Manifest DIFF: review configuration before any push." >&2
            diff -u appsscript.json "$RUNNER_TEMP/psb-clasp/appsscript.json" || true
            exit 1
          }
          echo "Manifest MATCH"
