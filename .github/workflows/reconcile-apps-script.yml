name: Apps Script Reconcile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Configure temporary Apps Script project
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$SCRIPT_ID"
          mkdir -p /tmp/psb-clasp
          printf '{"scriptId":"%s","rootDir":"/tmp/psb-clasp"}\n' "$SCRIPT_ID" > /tmp/psb-clasp/.clasp.json
      - name: Pull remote project into disposable directory
        working-directory: /tmp/psb-clasp
        run: |
          clasp pull --force
          test -f appsscript.json
      - name: Compare manifest
        run: |
          echo "=== Repository manifest ==="
          cat appsscript.json
          echo "=== Remote Apps Script manifest ==="
          cat /tmp/psb-clasp/appsscript.json
          cmp -s appsscript.json /tmp/psb-clasp/appsscript.json && echo "Manifest MATCH" || { echo "Manifest DIFF: review before push."; diff -u appsscript.json /tmp/psb-clasp/appsscript.json || true; exit 1; }
      - name: Dry-run source status
        working-directory: apps-script
        run: |
          echo "=== clasp status: files that would be written by push ==="
          clasp show-file-status --json
