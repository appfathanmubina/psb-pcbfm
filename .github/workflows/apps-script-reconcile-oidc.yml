name: Apps Script Reconcile (GitHub OIDC)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apps-script-production-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud using GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/script.projects.readonly
          create_credentials_file: false

      - name: Compare production Apps Script source (read only)
        env:
          APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node .github/scripts/reconcile-apps-script-oidc.mjs
