name: Apps Script Production Deployment (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_manual:
        description: Type MANUAL to display the production deployment checklist
        required: true
        type: string

permissions:
  contents: read

jobs:
  checklist:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_manual == 'MANUAL' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Production deployment checklist
        run: |
          echo "No Apps Script deployment was created or updated."
          echo "Automatic DEPLOY is disabled because no OAuth credentials are configured."
          echo "After manually synchronizing and testing the source in Apps Script:"
          echo "1. Open the existing production deployment in Apps Script."
          echo "2. Select Edit deployment."
          echo "3. Select New version and enter a description."
          echo "4. Keep the existing deployment ID and Web App URL."
          echo "5. Confirm Execute as and Who has access settings, then deploy."
