name: Deploy Existing Apps Script Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to authorize production deployment update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Configure Apps Script project
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
        run: |
          test -n "$SCRIPT_ID"
          test -n "$DEPLOYMENT_ID"
          if [[ ! "$SCRIPT_ID" =~ ^[A-Za-z0-9_-]+$ || ! "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Apps Script or deployment ID has an unexpected format." >&2
            exit 1
          fi
          printf '{"scriptId":"%s","rootDir":"apps-script"}\n' "$SCRIPT_ID" > apps-script/.clasp.json
      - name: Validate required source and manifests
        run: |
          test -f apps-script/Code.gs
          test -f apps-script/Index.html
          test -f apps-script/SetupDatabase.gs
          test -f apps-script/Bridge.html
          test -f apps-script/BridgeServer.gs
          test -f apps-script/appsscript.json
          node --check frontend/app.js
          node -e "const fs=require('fs'); const {isDeepStrictEqual}=require('util'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(!isDeepStrictEqual(a,b)){ console.error('Manifest mismatch; deployment blocked.'); process.exit(1); }"
      - name: Verify repository source exactly matches Apps Script remote
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: bash .github/scripts/check-apps-script-remote.sh
      - name: Update configured production deployment only
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}"
