name: Deploy Apps Script
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Existing Apps Script deployment ID (optional)
        required: false
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Configure Apps Script project
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$SCRIPT_ID"
          printf '{"scriptId":"%s","rootDir":"apps-script"}\n' "$SCRIPT_ID" > apps-script/.clasp.json
      - name: Validate source
        run: |
          test -f apps-script/Code.gs
          test -f apps-script/SetupDatabase.gs
          test -f apps-script/Bridge.gs
      - name: Push source to Apps Script
        working-directory: apps-script
        run: clasp push --force
      - name: Update existing deployment
        if: ${{ inputs.deployment_id != '' }}
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}"
      - name: Create deployment when no deployment ID was supplied
        if: ${{ inputs.deployment_id == '' }}
        working-directory: apps-script
        run: clasp deploy --description "GitHub Actions ${GITHUB_SHA}"
