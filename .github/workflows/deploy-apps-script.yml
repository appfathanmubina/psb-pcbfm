name: Deploy PSB Apps Script Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to push source and update the existing production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: psb-apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate source and manifest
        run: |
          node --check frontend/app.js
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error('Root and Apps Script manifests differ');"
          for f in Code.gs Index.html SetupDatabase.gs Bridge.html BridgeServer.gs appsscript.json; do test -f "apps-script/$f"; done
      - name: Push, version, and update existing deployment
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PRODUCTION_DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/apps-script-api.mjs deploy
