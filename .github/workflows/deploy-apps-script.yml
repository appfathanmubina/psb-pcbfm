name: Deploy Existing Apps Script Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to authorize production deployment update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          PRODUCTION_DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$APPS_SCRIPT_ID"
          test -n "$PRODUCTION_DEPLOYMENT_ID"
          node --check .github/scripts/apps-script-api.mjs
      - name: Update configured existing deployment using Apps Script API
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          PRODUCTION_DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/apps-script-api.mjs deploy
