name: Apps Script Reconcile (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout production source baseline
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Reconcile production Apps Script source (read only)
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: bash .github/scripts/reconcile-app-script-readonly.sh
