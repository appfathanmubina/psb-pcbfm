name: Preflight Apps Script (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Compare repository source with remote (read only)
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: bash .github/scripts/check-apps-script-remote.sh
