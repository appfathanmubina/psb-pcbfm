name: Deploy PSB GitHub Pages (Production + Testing)

on:
  push:
    branches: ["main", "Audit-Production"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Audit-Production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source (main)
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Checkout testing source (Audit-Production)
        uses: actions/checkout@v6
        with:
          ref: Audit-Production
          path: source-testing

      - name: Assemble isolated Pages site
        run: |
          set -euo pipefail
          test -f source-main/frontend/index.html
          test -f source-testing/frontend/index.html
          mkdir -p public/testing
          cp -a source-main/frontend/. public/
          cp -a source-testing/frontend/. public/testing/

      - name: Validate production and testing artifacts
        run: |
          set -euo pipefail
          for root in public public/testing; do
            test -f "$root/index.html"
            test -f "$root/styles.css"
            test -f "$root/app.js"
            test -f "$root/api-bridge.js"
          test -f "$root/testing-storage.js"
            test -f "$root/manifest.webmanifest"
            test -f "$root/sw.js"
            node --check "$root/app.js"
            node --check "$root/api-bridge.js"
            node --check "$root/testing-storage.js"
            node -e "JSON.parse(require('fs').readFileSync('$root/manifest.webmanifest','utf8'))"
          done
          node -e "const fs=require('fs'); const test=fs.readFileSync('public/testing/api-bridge.js','utf8'); const prod=fs.readFileSync('public/api-bridge.js','utf8'); const expected='https://script.google.com/macros/s/AKfycbybY_5ALnk_UeKIE05BlXFM2AzvcXv9zUQrFD163k8NwCB8mDEbMhXfFSDKSeE9De6t/exec'; if(!test.includes(expected)){console.error('Testing PWA is not connected to the configured testing Web App.');process.exit(1);} if(test===prod){console.error('Testing and production bridge bundles must differ.');process.exit(1);} const app=fs.readFileSync('public/testing/app.js','utf8'); const storage=fs.readFileSync('public/testing/testing-storage.js','utf8'); if(!storage.includes('psb_session_testing')||!storage.includes('psb_public_config_testing')){console.error('Testing browser storage namespace is not isolated.');process.exit(1);} if(app.includes('https://appfathanmubina.github.io/psb-pcbfm/gallery/')){console.error('Testing gallery still points to production root.');process.exit(1);} const sw=fs.readFileSync('public/testing/sw.js','utf8'); if(!sw.includes('psb-pwa-testing-shell-v1')){console.error('Testing Service Worker cache namespace is not isolated.');process.exit(1);} if(sw.includes('psb-pwa-shell-v32-33-0')){console.error('Testing Service Worker shares production cache namespace.');process.exit(1);} const html=fs.readFileSync('public/testing/index.html','utf8'); if(!html.includes('LINGKUNGAN PENGUJIAN')){console.error('Testing environment banner missing.');process.exit(1);} const m=JSON.parse(fs.readFileSync('public/testing/manifest.webmanifest','utf8')); if(!m.name.includes('TESTING')||m.scope!=='./'||m.start_url!=='./'){console.error('Testing PWA manifest identity or scope is invalid.');process.exit(1);} "
          node -e "const fs=require('fs'); const shell=fs.readFileSync('source-main/apps-script/Index.html','utf8'); const expected='https://appfathanmubina.github.io/psb-pcbfm/psb-fm-apps-script.js'; if(!shell.includes(expected)){console.error('Production Apps Script shell bundle URL mismatch.');process.exit(1);} "
      
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./public"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Audit-Production' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
