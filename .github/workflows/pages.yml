name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required files and source
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f frontend/psb-fm-apps-script.js
          test -f frontend/manifest.webmanifest
          test -f frontend/sw.js
          test -f apps-script/Code.gs
          test -f apps-script/SetupDatabase.gs
          test -f apps-script/BridgeServer.gs
          test -f apps-script/Index.html
          test -f apps-script/appsscript.json
          node --check frontend/app.js
          node --check frontend/psb-fm-apps-script.js
          node -e "const fs=require('fs'); const shell=fs.readFileSync('apps-script/Index.html','utf8'); const expected='https://appfathanmubina.github.io/psb-pcbfm/psb-fm-apps-script.js'; if(!shell.includes(expected)){console.error('Apps Script shell bundle URL mismatch.');process.exit(1);} if(!fs.existsSync('frontend/psb-fm-apps-script.js')){console.error('Apps Script bundle missing from Pages artifact source.');process.exit(1);} const wf=fs.readFileSync('.github/workflows/pages.yml','utf8'); if(!/path:\\s*[\"']\\.\\/frontend[\"']/.test(wf)){console.error('Pages artifact must publish the frontend directory.');process.exit(1);}"
          node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'))"
          node -e "const fs=require('fs'); const {isDeepStrictEqual}=require('util'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(!isDeepStrictEqual(a,b)){ console.error('Manifest mismatch; Pages deployment blocked.'); process.exit(1); }"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./frontend"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
