name: Validate PSB PWA
on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check required files
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f frontend/psb-fm-apps-script.js
          test -f frontend/manifest.webmanifest
          test -f frontend/sw.js
          test -f apps-script/Code.gs
          test -f apps-script/SetupDatabase.gs
          test -f apps-script/BridgeServer.gs
          test -f apps-script/Bridge.html
          test -f apps-script/Index.html
          test -f apps-script/appsscript.json
      - name: Ensure Apps Script file basenames are unique
        run: |
          node -e "const fs=require('fs'); const files=fs.readdirSync('apps-script').filter(x=>/\\.(gs|html)$/.test(x)); const seen=new Set(); for(const f of files){const base=f.replace(/\\.(gs|html)$/,''); if(seen.has(base)){console.error('Duplicate Apps Script file basename: '+base);process.exit(1);} seen.add(base);}"
      - name: Validate JavaScript and JSON
        run: |
          node --check frontend/app.js
          node --check frontend/psb-fm-apps-script.js
          node --check < apps-script/Code.gs
          node --check < apps-script/SetupDatabase.gs
          node --check < apps-script/BridgeServer.gs
          node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'))"
      - name: Validate inline HTML and PWA bridge JavaScript syntax
        run: node tests/html-javascript-syntax.test.js
      - name: Test loading popup copy and desktop modal layout
        run: node tests/loading-popup-modal-layout.test.js
      - name: Guard Apps Script HTML Service payload size
        run: node tests/apps-script-html-payload.test.js
      - name: Test password hash compatibility and migration safeguards
        run: node tests/password-migration.test.js
      - name: Test upload validation safeguards
        run: node tests/upload-validation.test.js
      - name: Test document upload lock and timeout resilience
        run: node tests/document-upload-resilience.test.js
      - name: Test document upload replacement and ambiguous-commit recovery
        run: node tests/document-upload-replacement-recovery.test.js
      - name: Test replaced-document verification and non-blocking audit safeguards
        run: node tests/document-replaced-verification-guard.test.js
      - name: Test payment proof upload lock and commit resilience
        run: node tests/payment-upload-resilience.test.js
      - name: Test payment append ambiguous-commit recovery
        run: node tests/payment-append-commit-recovery.test.js
      - name: Test payment partial-commit recovery safeguards
        run: node tests/payment-partial-commit-recovery.test.js
      - name: Test payment submission notification recovery and idempotent retry
        run: node tests/payment-submission-notification-recovery.test.js
      - name: Test manual bill idempotent creation and notification recovery
        run: node tests/manual-bill-idempotent-recovery.test.js
      - name: Test bill append ambiguous-commit recovery
        run: node tests/bill-append-commit-recovery.test.js
      - name: Test payment verification and rejection recovery safeguards
        run: node tests/payment-verification-rejection-recovery.test.js
      - name: Test payment verification state consistency and partial-failure recovery
        run: node tests/payment-verification-state-consistency.test.js
      - name: Test payment ledger reconciliation and full registration workflow
        run: node tests/payment-ledger-reconciliation.test.js
      - name: Test event-keyed notification idempotency and transaction event identity
        run: node tests/notification-event-idempotency.test.js
      - name: Test UI mutation and refresh failure feedback
        run: node tests/ui-error-recovery.test.js
      - name: Test payment and re-registration concurrency recovery
        run: node tests/payment-reregistration-transaction-recovery.test.js
      - name: Test selection transaction recovery safeguards
        run: node tests/selection-transaction-recovery.test.js
      - name: Test re-registration opening transaction safeguards
        run: node tests/reregistration-open-transaction.test.js
      - name: Test ScriptLock timeout and batch-write safeguards
        run: node tests/script-lock-safeguards.test.js
      - name: Test incident mutation ScriptLock and batch-write safeguards
        run: node tests/incident-lock-safeguards.test.js
      - name: Test session maintenance batch-write safeguards
        run: node tests/session-maintenance-batch-write.test.js
      - name: Test session restore and one-load-per-session menu navigation
        run: node tests/session-navigation-cache.test.js
      - name: Test Remember Me and secure login autofill
        run: node tests/login-remember-me.test.js
      - name: Test Wali workflow navigation and notification badge safeguards
        run: node tests/wali-workflow-navigation.test.js
      - name: Test role-based navigation consistency
        run: node tests/role-menu-access.test.js
      - name: Test Wali selection score and unpublished-result privacy
        run: node tests/wali-selection-result-privacy.test.js
      - name: Test registration payment and document status consistency
        run: node tests/registration-status-consistency.test.js
      - name: Test registration submission notification recovery and idempotent retry
        run: node tests/registration-submission-notification-recovery.test.js
      - name: Test idempotent registration persistence and partial-write recovery
        run: node tests/registration-idempotent-save.test.js
      - name: Test Drive private document safeguards
        run: node tests/drive-gallery-security.test.js
      - name: Test GitHub-only public gallery assets and source
        run: node tests/github-gallery.test.js
      - name: Test API response and audit data redaction
        run: node tests/api-audit-redaction.test.js
      - name: Test production data integrity duplicate coverage
        run: node tests/data-integrity-duplicate-coverage.test.js
      - name: Test production readiness test-data blockers
        run: node tests/production-readiness-blockers.test.js
      - name: Test authentication, login throttling, and session safeguards
        run: node tests/auth-session-security.test.js
      - name: Test authentication and session concurrency recovery
        run: node tests/session-concurrency-recovery.test.js
      - name: Test latest session token and logout confirmation safeguards
        run: node tests/session-token-logout-confirmation.test.js
      - name: Test authorization and resource ownership safeguards
        run: node tests/authorization-ownership.test.js
      - name: Test direct Wali registration without email verification safeguards
        run: node tests/email-otp.test.js
      - name: Test manual user legacy identity duplicate safeguards
        run: node tests/manual-user-legacy-identity.test.js
      - name: Test OTP, account recovery, and password input safeguards
        run: node tests/auth-recovery-security.test.js
      - name: Test Script Properties preservation safeguards
        run: node tests/setup-script-properties.test.js
      - name: Test PWA icon metadata and dimensions
        run: node tests/pwa-icon-metadata.test.js
      - name: Test Android and iOS PWA installation experience
        run: node tests/pwa-install-experience.test.js
      - name: Test Apps Script and PWA UI function parity safeguards
        run: node tests/ui-function-parity.test.js
      - name: Test retired PSB Chat and legacy trigger cleanup safeguards
        run: node tests/chat-feature-removal.test.js
      - name: Test PWA and Apps Script bridge contract
        run: node tests/bridge-contract.test.js
      - name: Test safe retry for transient API Bridge lock contention
        run: node tests/bridge-login-retry-safety.test.js
      - name: Test loading and login critical-path safeguards
        run: node tests/loading-login-performance.test.js
      - name: Test dashboard performance and final UI safeguards
        run: node tests/dashboard-performance.test.js
      - name: Test dashboard role-scoped operational queue safeguards
        run: node tests/backend-dashboard-role-scope.test.js
      - name: Test Dashboard and Wali narrow data projections
        run: node tests/dashboard-wali-projection.test.js
      - name: Test backend batch-read optimization safeguards
        run: node tests/backend-read-optimization.test.js
      - name: Test document page and verification queue performance safeguards
        run: node tests/backend-document-page-performance.test.js
      - name: Test current document and verification detail performance safeguards
        run: node tests/backend-verification-detail-performance.test.js
      - name: Test reregistration page performance and ownership safeguards
        run: node tests/backend-reregistration-page-performance.test.js
      - name: Test monitoring page batch-read and historical reconciliation safeguards
        run: node tests/backend-monitoring-page-performance.test.js
      - name: Test academic year lifecycle projection safeguards
        run: node tests/backend-academic-year-lifecycle-projection.test.js
      - name: Test selection page batch-read, indexing, and authorization safeguards
        run: node tests/backend-selection-page-performance.test.js
      - name: Test sparse Google Sheets column projections
        run: node tests/backend-sparse-column-projection.test.js
      - name: Test reporting page payment aggregation and compatibility safeguards
        run: node tests/backend-reporting-page-performance.test.js
      - name: Test payment page performance and ownership safeguards
        run: node tests/backend-payment-page-performance.test.js
      - name: Test staff registration and verification server pagination safeguards
        run: node tests/backend-staff-list-pagination.test.js
      - name: Test Wali home cleanup, automatic form billing, and parallel document/payment safeguards
        run: node tests/wali-parallel-payment-flow.test.js
      - name: Test registration NISN field and school type removal safeguards
        run: node tests/registration-form-fields.test.js
      - name: Test desktop public landing responsive safeguards
        run: node tests/public-home-responsive.test.js
      - name: Test PWA desktop cache refresh safeguards
        run: |
          node --check < frontend/sw.js
          node tests/pwa-cache-refresh.test.js
      - name: Validate shell scripts
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(find .github/scripts -maxdepth 1 -type f -name '*.sh' -print | sort)
      - name: Ensure Apps Script manifests match
        run: |
          node -e "const fs=require('fs'); const {isDeepStrictEqual}=require('util'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(!isDeepStrictEqual(a,b)){ console.error('Manifest mismatch: root and Clasp manifests differ.'); process.exit(1); }"
      - name: Block browser-callable internal maintenance and bootstrap functions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const checks = [
            ['apps-script/Code.gs', ['cleanupPSBSessions_'], ['cleanupPSBSessions', 'runChatAutomation', 'runChatAutomation_']],
            ['apps-script/SetupDatabase.gs', ['setupPSBDatabase_', 'removeLegacyChatAutomationTriggers_', 'configureInitialSuperadmin_', 'createInitialSuperadmin_'], ['setupPSBDatabase', 'removeLegacyChatAutomationTriggers', 'configureInitialSuperadmin', 'createInitialSuperadmin', 'installChatAutomationTrigger']]
          ];
          for (const [file, protectedNames, forbiddenNames] of checks) {
            const source = fs.readFileSync(file, 'utf8');
            for (const name of protectedNames) {
              if (!new RegExp('^function\\s+' + name + '\\s*\\(', 'm').test(source)) {
                console.error('Missing protected internal function ' + name + ' in ' + file);
                process.exit(1);
              }
            }
            for (const name of forbiddenNames) {
              if (new RegExp('^function\\s+' + name + '\\s*\\(', 'm').test(source)) {
                console.error('Unsafe browser-callable function name detected: ' + name);
                process.exit(1);
              }
            }
          }
          NODE
