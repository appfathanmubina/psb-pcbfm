name: Validate PSB PWA
on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check required files
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f frontend/manifest.webmanifest
          test -f frontend/sw.js
          test -f apps-script/Code.gs
          test -f apps-script/SetupDatabase.gs
          test -f apps-script/BridgeServer.gs
          test -f apps-script/Bridge.html
          test -f apps-script/Index.html
          test -f apps-script/appsscript.json
      - name: Ensure Apps Script file basenames are unique
        run: |
          node -e "const fs=require('fs'); const files=fs.readdirSync('apps-script').filter(x=>/\\.(gs|html)$/.test(x)); const seen=new Set(); for(const f of files){const base=f.replace(/\\.(gs|html)$/,''); if(seen.has(base)){console.error('Duplicate Apps Script file basename: '+base);process.exit(1);} seen.add(base);}"
      - name: Validate JavaScript and JSON
        run: |
          node --check frontend/app.js
          node --check < apps-script/Code.gs
          node --check < apps-script/SetupDatabase.gs
          node --check < apps-script/BridgeServer.gs
          node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'))"
      - name: Validate inline HTML and PWA bridge JavaScript syntax
        run: node tests/html-javascript-syntax.test.js
      - name: Test password hash compatibility and migration safeguards
        run: node tests/password-migration.test.js
      - name: Test upload validation safeguards
        run: node tests/upload-validation.test.js
      - name: Test Drive private document safeguards
        run: node tests/drive-gallery-security.test.js
      - name: Test GitHub-only public gallery assets and source
        run: node tests/github-gallery.test.js
      - name: Test API response and audit data redaction
        run: node tests/api-audit-redaction.test.js
      - name: Test authentication, login throttling, and session safeguards
        run: node tests/auth-session-security.test.js
      - name: Test authorization and resource ownership safeguards
        run: node tests/authorization-ownership.test.js
      - name: Test Email OTP registration safeguards
        run: node tests/email-otp.test.js
      - name: Test OTP, account recovery, and password input safeguards
        run: node tests/auth-recovery-security.test.js
      - name: Test Script Properties preservation safeguards
        run: node tests/setup-script-properties.test.js
      - name: Test PWA icon metadata and dimensions
        run: node tests/pwa-icon-metadata.test.js
      - name: Test Apps Script and PWA UI function parity safeguards
        run: node tests/ui-function-parity.test.js
      - name: Test PWA and Apps Script bridge contract
        run: node tests/bridge-contract.test.js
      - name: Test loading and login critical-path safeguards
        run: node tests/loading-login-performance.test.js
      - name: Test desktop public landing responsive safeguards
        run: node tests/public-home-responsive.test.js
      - name: Validate shell scripts
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(find .github/scripts -maxdepth 1 -type f -name '*.sh' -print | sort)
      - name: Ensure Apps Script manifests match
        run: |
          node -e "const fs=require('fs'); const {isDeepStrictEqual}=require('util'); const a=JSON.parse(fs.readFileSync('appsscript.json','utf8')); const b=JSON.parse(fs.readFileSync('apps-script/appsscript.json','utf8')); if(!isDeepStrictEqual(a,b)){ console.error('Manifest mismatch: root and Clasp manifests differ.'); process.exit(1); }"
      - name: Block browser-callable internal maintenance and bootstrap functions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const checks = [
            ['apps-script/Code.gs', ['cleanupPSBSessions_', 'runChatAutomation_'], ['cleanupPSBSessions', 'runChatAutomation']],
            ['apps-script/SetupDatabase.gs', ['setupPSBDatabase_', 'installChatAutomationTrigger_', 'configureInitialSuperadmin_', 'createInitialSuperadmin_'], ['setupPSBDatabase', 'installChatAutomationTrigger', 'configureInitialSuperadmin', 'createInitialSuperadmin']]
          ];
          for (const [file, protectedNames, forbiddenNames] of checks) {
            const source = fs.readFileSync(file, 'utf8');
            for (const name of protectedNames) {
              if (!new RegExp('^function\\s+' + name + '\\s*\\(', 'm').test(source)) {
                console.error('Missing protected internal function ' + name + ' in ' + file);
                process.exit(1);
              }
            }
            for (const name of forbiddenNames) {
              if (new RegExp('^function\\s+' + name + '\\s*\\(', 'm').test(source)) {
                console.error('Unsafe browser-callable function name detected: ' + name);
                process.exit(1);
              }
            }
          }
          NODE
